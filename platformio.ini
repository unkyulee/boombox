; MP3 player for the Guition JC4827W543C (ESP32-S3, 4.3" 480x272 NV3041A, GT911 touch)

[env:jc4827w543c]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N4R8: 4 MB flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
; Two app slots, so the web page can install firmware updates (see partitions.csv)
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    tamctec/TAMC_GT911@^1.0.2
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
